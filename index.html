<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사업계획서 작성 도우미</title>
<style>
  :root{ --bg:#eef2f8; --ink:#16202e; --sub:#586579; --line:#d3deea; --accent:#0369a1; --good:#15803d; --warn:#b45309; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.6}
  header.top{background:#0c2d48;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  header.top h1{margin:0;font-size:17px}
  header.top .sp{flex:1}
  header.top .st{font-size:12.5px;color:#a9d3ee}
  header.top button,header.top label.btn{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:8px;border:1px solid #2a6a93;background:#10507a;color:#fff;cursor:pointer;font-weight:600}
  header.top button.plan{background:linear-gradient(90deg,#0369a1,#7c3aed);border:0;font-size:13.5px;padding:7px 14px}
  .main{max-width:1040px;margin:0 auto;padding:14px 16px 100px}
  /* 진행 흐름 */
  .flowbox{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 14px 12px;box-shadow:0 4px 16px #0369a115}
  .flow{display:flex;align-items:flex-start;justify-content:space-between}
  .node{flex:0 0 auto;width:132px;background:none;border:0;font:inherit;cursor:pointer;text-align:center;padding:2px 2px 6px;border-radius:14px}
  .node:hover{background:#f3f7fb}
  .ring{--p:0;--c:#94a3b8;width:64px;height:64px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p) * 1%), #dde5ee 0);position:relative}
  .ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff}
  .ring span{position:relative;font-size:24px}
  .node b{display:block;font-size:14px}
  .node small{display:block;color:var(--sub);font-size:11.5px;margin-top:-2px}
  .node em{display:inline-block;font-style:normal;font-size:12px;font-weight:700;margin-top:2px;padding:1px 9px;border-radius:99px;background:#eef2f7;color:#475569}
  .node.done em{background:#dcfce7;color:#166534}.node.part em{background:#fef3c7;color:#92400e}
  .node.done .ring::after{content:"✓";position:absolute;right:-2px;top:-2px;width:22px;height:22px;border-radius:50%;background:#16a34a;color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;z-index:2}
  .node.cur .ring{box-shadow:0 0 0 4px #bfe0f5;animation:pulse 1.8s infinite}
  .node.cur b{color:var(--accent)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 3px #bfe0f5}50%{box-shadow:0 0 0 8px #bfe0f533}}
  .dots{display:flex;justify-content:center;gap:4px;margin-top:6px;flex-wrap:wrap}
  .dots i{width:11px;height:11px;border-radius:3px;background:#dde5ee;display:block}
  .dots i.ok{background:var(--c,#16a34a)}
  .conn{flex:1;height:6px;margin-top:29px;background:#dde5ee;border-radius:99px;position:relative;min-width:14px;overflow:hidden}
  .conn u{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#0369a1,#7c3aed);border-radius:99px}
  .total{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--sub)}
  .total .bar{flex:1;height:10px;background:#dde5ee;border-radius:99px;overflow:hidden}
  .total .bar i{display:block;height:100%;background:linear-gradient(90deg,#0369a1,#7c3aed);transition:width .4s}
  .next{margin-top:10px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:12px;padding:8px 12px;font-size:13.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .next button{font:inherit;font-size:12.5px;font-weight:700;border:1px solid #7dd3fc;background:#fff;border-radius:8px;padding:3px 11px;cursor:pointer;color:#075985}
  .bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 8px;font-size:13px;color:var(--sub)}
  .bar2 b{color:var(--ink)}
  .bottomnav{display:flex;gap:10px;justify-content:space-between;margin-top:14px}
  .bottomnav button{font:inherit;font-weight:700;font-size:15px;padding:12px 22px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
  .bottomnav button.go{background:linear-gradient(90deg,#0369a1,#7c3aed);color:#fff;border:0}
  .bottomnav button:disabled{opacity:.35;cursor:default}
  /* 사업계획서 */
  .planbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
  .planbar button{font:inherit;font-weight:700;font-size:13.5px;padding:8px 14px;border-radius:10px;border:1px solid #94a3b8;background:#fff;cursor:pointer}
  .planbar button.go{background:linear-gradient(90deg,#0369a1,#7c3aed);color:#fff;border:0}
  .missing{background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:13.5px}
  .missing .m{display:inline-flex;margin:3px 6px 3px 0}
  .missing button{font:inherit;font-size:12.5px;border:1px solid #fcd34d;background:#fff;border-radius:8px;padding:2px 10px;cursor:pointer;color:#92400e}
  .okbox{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
  #planDoc{max-width:860px;margin:0 auto;background:#fff;padding:36px 44px;box-shadow:0 2px 12px rgba(0,0,0,.15);font-size:14px;line-height:1.7;color:#111}
  .ptitle{text-align:center;font-size:24px;margin:0 0 6px}.pnote{font-size:12px;color:#b45309;margin-bottom:14px;text-align:center}
  .ph1{font-size:17px;margin:22px 0 8px;padding:6px 10px;background:#dde7f0;color:#0f3d63;border-radius:4px}.ph2{font-size:15px;margin:14px 0 4px;color:#0f766e}.ph3{font-size:14px;margin:10px 0 3px}
  .pp{border:1px solid #888;padding:8px 10px;white-space:pre-wrap;word-break:keep-all}.pp.pe{color:#999;background:#fafafa}
  .ptb{width:100%;border-collapse:collapse;margin:6px 0;font-size:13px}.ptb th,.ptb td{border:1px solid #888;padding:5px 8px;text-align:left;vertical-align:top;white-space:pre-wrap}.ptb th{background:#e9ecef}.ptb.kv th{width:22%}
  /* 항목 카드(입력) */
  .panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-top:12px}
  .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .num{width:36px;height:36px;border-radius:50%;color:#fff;font-weight:800;display:grid;place-items:center;background:var(--cc)}
  .panel h2{margin:0;font-size:20px}
  .tag{background:#fdf1cf;color:#92400e;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700}
  .desc{color:var(--sub);margin:6px 0 12px 46px;font-size:14px}
  .f{margin-bottom:14px}
  .f>label{display:block;font-weight:800;font-size:14.5px;margin-bottom:6px}
  .f>label em{color:#e11d48;font-style:normal;margin-left:3px}
  .lab{font-size:12px;color:var(--sub);margin-bottom:2px}
  input[type=text],input[type=number],textarea{width:100%;border:1px solid #d5dcec;border-radius:12px;padding:10px 12px;font:inherit;background:#f8fafd}
  textarea{min-height:76px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid #93b4f5;background:#fff}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px;align-items:center}
  .chips .sp{color:#7c3aed;font-size:12px;font-weight:700}
  .chip{border:1px dashed #b39ae6;background:#f5f0ff;color:#5b21b6;border-radius:16px;padding:3px 11px;font-size:12.5px;cursor:pointer}
  .chip:hover{background:#ebe2ff}.chip.on{background:#5b21b6;color:#fff;border-style:solid}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .calc{background:#fff7e6;border:1px solid #f5d08a;border-radius:10px;padding:8px 12px;font-weight:700;margin-top:8px;font-size:14px}
  .rows{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;margin-bottom:6px}
  .out{background:#eef4ff;border:1px solid #c9dafc;border-radius:12px;padding:10px 12px;margin-top:4px}
  .out b{color:#1d4ed8;font-size:13px}
  .out textarea{background:#fff;margin-top:6px}
  .out .re{font-size:12px;margin-top:4px;color:var(--sub)}
  .out .re button{border:1px solid #b9c4dd;background:#fff;border-radius:8px;padding:2px 8px;cursor:pointer;font-size:12px}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .tools button{border:1px solid #b9c4dd;background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
  .tools button:hover{background:#eef3ff}
  .need{background:#fff1f2;border:1px solid #fecdd3;border-radius:10px;padding:7px 12px;font-size:13px;margin:0 0 12px;color:#9f1239}
  .need.ok{background:#ecfdf3;border-color:#bbf0d2;color:#1f7a55}
  @media (max-width:760px){ .conn{display:none} .flow{flex-wrap:wrap;justify-content:center} .node{width:30%} #planDoc{padding:18px 14px} .row2,.row3,.rows{grid-template-columns:1fr} .desc{margin-left:0} }
  @media print{
    header.top,.flowbox,.bar2,#view,.bottomnav,.planbar,.missing{display:none !important}
    body{background:#fff} .main{padding:0;max-width:none} #planDoc{box-shadow:none;margin:0;padding:0;max-width:none}
    .ph1,.ph2,.ph3{break-after:avoid} .ptb tr,.pp{break-inside:avoid} @page{size:A4;margin:14mm}
  }
</style>
</head>
<body>
<header class="top">
  <h1>📝 사업계획서 작성 도우미</h1>
  <span class="sp"></span>
  <button class="plan" id="btnPlan">📑 사업계획서 미리보기</button>
  <button id="btnDir">📁 저장 폴더 지정</button>
  <button id="btnSave">💾 프로젝트 저장</button>
  <label class="btn">📂 불러오기<input type="file" id="fileLoad" accept=".json" hidden></label>
  <button id="btnReset">🗑 새로 시작</button>
  <span class="st" id="status">준비됨</span>
</header>
<div class="main">
  <div class="flowbox">
    <div class="flow" id="flow"></div>
    <div class="total"><span id="totTxt">전체 진행률</span><div class="bar"><i id="totBar" style="width:0"></i></div></div>
    <div class="next" id="next"></div>
  </div>
  <div class="bar2" id="bar2"></div>
  <div id="view"></div>
  <div id="planWrap" style="display:none">
    <div class="planbar"><b>📑 사업계획서 초안</b><span style="flex:1"></span><button id="pRefresh">🔄 새로고침</button><button id="pPrint">🖨 인쇄 / PDF</button><button class="go" id="pDocx">📄 Word로 저장</button></div>
    <div class="missing" id="missing"></div>
    <div id="planDoc"></div>
  </div>
  <div class="bottomnav"><button id="bPrev">◀ 이전 단계</button><button id="bNext" class="go">다음 단계 ▶</button></div>
</div>

<script>
const KEY="bizplan-basic-v3";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* 4단계 + 미리보기 (워크플로우와 같은 구성) */
const STEPS=[
 {k:"prob",name:"문제인식",sub:"Problem",icon:"🔍",c:"#e11d48"},
 {k:"sol",name:"실현가능성",sub:"Solution",icon:"🛠",c:"#d97706"},
 {k:"grow",name:"성장전략",sub:"Scale-up",icon:"📈",c:"#0f766e"},
 {k:"team",name:"팀구성",sub:"Team",icon:"👥",c:"#7c3aed"},
 {k:"plan",name:"사업계획서",sub:"미리보기·출력",icon:"📑",c:"#0369a1"}
];
const SK=["기획·경영","개발·기술","디자인","마케팅·영업","운영·생산","재무·회계","법률·지식재산"];
const BUD=["재료비","외주용역비","지급수수료","광고선전비","인건비","기타"];
/* 양식 항목 = 카드 1장. s = 단계(0~3), a = 번호 원 숫자(0이면 ✓) */
const ITEMS=[
 {id:"g",s:0,a:0,no:"일반",t:"일반현황",d:"사업계획서 맨 앞에 들어가는 기본 정보예요. 협약기간 내 산출물과 사업비는 뒤에서 적은 내용으로 자동 채워져요.",
  qs:[{l:"창업 아이템 이름",fs:[{k:"item",ty:"text",ph:"예) 반반장 — 자취생을 위한 식재료 소분 공동구매 서비스",req:1}]},
      {l:"대표자(신청자) 이름과 형태",fs:[{k:"who",ty:"text",ph:"예) 홍길동 (개인 창업) / 홍길동 외 2명 (팀 창업)",req:1,ex:["(개인 창업)","외 2명 (팀 창업)"]}]}]},

 {id:"11",s:0,a:1,no:"1-1",t:"창업아이템의 개발 동기",d:"‘왜 이 아이템이 떠올랐는지’를 이야기처럼 풀어 쓰는 칸이에요. 아래 3개 질문에 짧게만 답하면 문장이 자동으로 만들어져요.",
  qs:[{l:"언제, 어디서 문제를 발견했나요?",fs:[{k:"when",ty:"text",ph:"예) 점심시간에 학교 식당 앞에서",req:1,ex:["등굣길 버스 정류장에서","집에서 가족을 도와드리다가","아르바이트를 하면서","여행을 가서"]}]},
      {l:"누가 불편을 겪었나요?",fs:[{k:"who1",ty:"text",ph:"예) 저와 친구들",req:1,ex:["저와 가족","같은 학과 친구들","동네 어르신들","직장인들"]}]},
      {l:"어떤 불편·손해가 있었나요? (숫자가 있으면 더 좋아요)",fs:[{k:"pain",ty:"text",ph:"예) 시간이 오래 걸렸습니다(20분)",req:1,ex:["시간이 오래 걸렸습니다(N분)","비용이 부담되었습니다(N원)","원하는 것을 구하기 어려웠습니다","안전·위생이 걱정되었습니다"]}]}],
  c:v=>j(`${v.when} 문제를 발견했습니다.`,`불편을 겪은 사람은 ‘${v.who1}’입니다.`,dot(`겪은 불편·손해: ${v.pain}`),"이 문제를 해결하는 아이템이 필요하다고 판단해 개발을 시작했습니다.")},

 {id:"12",s:0,a:1,no:"1-2",t:"창업아이템의 목적(필요성)",d:"누구의 어떤 문제를 어떻게 풀 것인지, 그 필요성을 보여 주는 칸이에요.",
  qs:[{l:"핵심 고객은 누구인가요?",fs:[{k:"target",ty:"text",ph:"예) 자취하는 대학생",req:1,ex:["자취하는 대학생","직장인","소상공인","학부모","시니어","1인 가구"]}]},
      {l:"어떻게 해결하나요? (한 문장)",fs:[{k:"solution",ty:"text",ph:"예) 이웃과 식재료를 소분해 나눠 사는 공동구매 앱을 만든다",req:1,ex:["이웃과 함께 나눠 사는 앱을 만든다","필요한 만큼만 빠르게 받는 서비스를 만든다","검증된 정보를 한곳에 모은 플랫폼을 만든다"]}]},
      {l:"이 문제가 진짜라는 근거는? (인터뷰·설문·통계)",fs:[{k:"evid",ty:"area",ph:"예) 대학생 12명 인터뷰 중 9명이 식재료를 버린 적이 있다고 답함 / 통계(출처·연도)",req:1,ex:["주변 N명에게 물어보니 N명이 공감했습니다","설문조사 N명 중 N%가 불편을 느꼈습니다","통계청·기사 자료로 확인했습니다(출처·연도)"]}]}],
  c:v=>j(`핵심 고객: ${v.target}.`,`해결 방안: ${dot(v.solution)}`,v.evid?`필요성의 근거: ${dot(v.evid)}`:"")},

 {id:"21",s:1,a:2,no:"2-1",t:"창업아이템의 개발·사업화 전략",d:"무엇을 언제까지 만들고, 어떻게 돈을 버는지 보여 주는 칸이에요.",
  qs:[{l:"핵심 기능 3가지는?",fs:[{k:"feature",ty:"area",ph:"1) …  2) …  3) …",req:1}]},
      {l:"협약 기간이 끝나면 무엇이 완성되어 있나요?",fs:[{k:"deliv",ty:"text",ph:"예) 이웃 매칭 기능이 있는 앱 1.0과 시범 이용자 100명",req:1,ex:["시제품(앱·웹) 1종과 시범 이용자 N명","상용 서비스 출시와 첫 유료 고객 N명","양산 가능한 제품 1종과 판매 채널 N곳"]}]},
      {l:"협약 기간 일정은? (초기 · 중기 · 말기)",fs:[{k:"m1",ty:"text",lab:"초기 (1~2개월)",ph:"예) 시제품 제작",req:1,ex:["시제품 제작","핵심 기능 설계"]},{k:"m2",ty:"text",lab:"중기 (3~5개월)",ph:"예) 시범 운영",req:1,ex:["시범 운영","고객 반응 수집"]},{k:"m3",ty:"text",lab:"말기 (6~8개월)",ph:"예) 개선판 출시",req:1,ex:["개선판 출시","첫 매출 발생"]}]},
      {l:"어떻게 돈을 버나요?",fs:[{k:"model",ty:"text",lab:"수익 모델",ph:"예) 구독",req:1,ex:["제품 판매","구독","수수료","광고","서비스 이용료"]},{k:"price",ty:"num",lab:"1인당 월 결제액(원)",ph:"예) 9900",req:1},{k:"buyers",ty:"num",lab:"목표 유료 고객 수(명)",ph:"예) 300",req:1,calc:1}]}],

 {id:"22",s:1,a:2,no:"2-2",t:"시장분석 및 경쟁력 확보방안",d:"시장이 얼마나 크고, 경쟁 대안과 무엇이 다른지 보여 주는 칸이에요.",

function j(...a){return a.filter(Boolean).join(" ")}
function dot(s){s=String(s||"").trim();return s?(/[.!?]$/.test(s)?s:s+"."):""}
function fm(n){return (Number(n)||0).toLocaleString()}
let S=load();
function blank(){return {a:{},t:{},man:{},step:0}}
function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){return blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function setStatus(m){$("status").textContent=m}
function allF(it){return it.qs.flatMap(q=>q.fs)}
function V(){const o={};for(const it of ITEMS)for(const f of allF(it)){const x=S.a[f.k];const s=typeof x==="string"?x.trim():(x==null?"":x);o[f.k]=(s===""&&f.req&&f.ty!=="rows")?"○○":s}return o}
function val(k){return S.a[k]==null?"":S.a[k]}
function rowsOf(){const r=S.a.rows;return Array.isArray(r)&&r.length===3?r:[{n:"",v:""},{n:"",v:""},{n:"",v:""}]}
function sumRows(){return rowsOf().reduce((t,r)=>t+(parseFloat(r.v)||0),0)}
function rowsTxt(){const r=rowsOf().filter(x=>x.n.trim()&&parseFloat(x.v));return r.length?`사업비 사용 계획: ${r.map(x=>`${x.n} ${fm(x.v)}만원`).join(", ")} (합계 ${fm(sumRows())}만원).`:""}
function fFilled(f){if(f.ty==="rows")return sumRows()>0&&rowsOf().some(r=>r.n.trim());if(f.ty==="num")return Number(val(f.k))>0;return String(val(f.k)).trim().length>=2}
function itDone(it){return allF(it).filter(f=>f.req).every(fFilled)}
function itMissing(it){return it.qs.filter(q=>q.fs.some(f=>f.req&&!fFilled(f))).map(q=>q.l.replace(/\s*\(.*?\)\s*/g,"").replace(/[?？]$/,""))}
function itemsOf(s){return ITEMS.filter(i=>i.s===s)}
function composed(it){return it.c&&allF(it).some(f=>f.ty!=="rows"&&String(val(f.k)).trim()!==""||f.ty==="rows"&&sumRows()>0)?it.c(V()):""}
function textOf(it){return S.man[it.id]?(S.t[it.id]||""):composed(it)}
const stepTotals=s=>{const l=itemsOf(s);return {done:l.filter(itDone).length,total:l.length}};

/* ───── 저장 폴더 / 파일 저장 (워크플로우와 같은 방식) ───── */
let dirHandle=null,dirAsked=false;
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("workbook-apps",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction("kv","readwrite").objectStore("kv").put(v,k);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
function dirUi(){$("btnDir").textContent=dirHandle?"📁 저장 폴더: "+dirHandle.name:"📁 저장 폴더 지정"}
async function pickDir(){
  if(!window.showDirectoryPicker){alert("이 브라우저는 폴더 지정을 지원하지 않아 파일이 ‘다운로드’ 폴더에 저장됩니다.\nChrome 또는 Edge에서 열어 주세요.");return false}
  try{dirHandle=await showDirectoryPicker({id:"bpb-save",mode:"readwrite"});await idbSet("dir-"+KEY,dirHandle);dirUi();return true}catch(e){return false}
}
(async()=>{try{dirHandle=(await idbGet("dir-"+KEY))||null}catch(e){}dirUi()})();
$("btnDir").onclick=pickDir;
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function saveFile(blob,name){
  if(!dirHandle&&!dirAsked&&window.showDirectoryPicker){dirAsked=true;if(confirm("저장 파일을 모아 둘 폴더를 지정할까요?\n(권장: 바이브 > 사업계획서기초 폴더. 한 번만 지정하면 이후 저장 파일이 모두 그 폴더에 만들어집니다.)"))await pickDir()}
  if(dirHandle){try{let p=await dirHandle.queryPermission({mode:"readwrite"});if(p!=="granted")p=await dirHandle.requestPermission({mode:"readwrite"});
    if(p==="granted"){const fh=await dirHandle.getFileHandle(name,{create:true}),w=await fh.createWritable();await w.write(blob);await w.close();setStatus("✔ ‘"+dirHandle.name+"’ 폴더에 저장됨: "+name);return}}catch(e){}}
  download(blob,name);setStatus("⬇ 다운로드 폴더에 저장됨(저장 폴더 미지정): "+name)
}
function stamp(){const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")}
function fn(ext){return "사업계획서기초_"+((val("item")||"무제").replace(/[\\/:*?"<>|]/g,"").slice(0,20))+"_"+stamp()+"."+ext}

/* ───── 진행 흐름 ───── */
function refreshFlow(){
  const cur=S.step;let html="",allDone=0,allTotal=0;
  STEPS.forEach((s,i)=>{
    if(i>0)html+=`<div class="conn"><u style="width:${i-1<4?Math.round(pct(i-1)):0}%"></u></div>`;
    let p,cls="",em,dots="";
    if(i<4){const t=stepTotals(i);p=t.total?t.done/t.total*100:0;allDone+=t.done;allTotal+=t.total;
      cls=t.done===t.total&&t.total?"done":t.done?"part":"";em=t.done===t.total&&t.total?"완료":t.done?`${t.done}/${t.total} 작성`:"시작 전";
      dots=itemsOf(i).map(x=>`<i class="${itDone(x)?"ok":""}" data-go="${i}:${x.id}" title="${x.no}. ${esc(x.t)}${itDone(x)?" ✔":""}"></i>`).join("")}
    else{p=allTotal?allDone/allTotal*100:0;cls=allDone===allTotal&&allTotal?"done":"";em=allDone===allTotal&&allTotal?"출력 가능":"초안 보기"}
    html+=`<button class="node ${cls} ${i===cur?"cur":""}" data-step="${i}" style="--c:${s.c}"><div class="ring" style="--p:${Math.round(p)};--c:${s.c}"><span>${s.icon}</span></div><b>${i+1}. ${s.name}</b><small>${s.sub}</small><em>${em}</em><div class="dots" style="--c:${s.c}">${dots}</div></button>`;
  });
  $("flow").innerHTML=html;
  const tp=allTotal?Math.round(allDone/allTotal*100):0;
  $("totBar").style.width=tp+"%";$("totTxt").textContent=`전체 진행률 ${tp}% (필수 항목 ${allDone}/${allTotal})`;
  let nx=null;for(let i=0;i<4&&!nx;i++){const m=itemsOf(i).find(x=>!itDone(x));if(m)nx={i,m}}
  $("next").innerHTML=nx?`👉 <b>다음 할 일</b> · ${nx.i+1}단계 ${STEPS[nx.i].name} — ${nx.m.no}. ${esc(nx.m.t)} <button data-go="${nx.i}:${nx.m.id}">이어서 작성하기</button>`:`🎉 모든 필수 항목을 작성했어요! <button data-step="4">사업계획서 미리보기·출력</button>`;
  $("bar2").innerHTML=cur===4?"":`<span>아이템 <b>${esc(val("item")||"미입력")}</b></span><span>· 참여 <b>${esc(val("who")||"미입력")}</b></span><span>· 여기서 쓴 내용은 다음 단계에 자동으로 이어져요</span>`;
  $("bPrev").disabled=cur===0;
  $("bNext").style.display=cur===4?"none":"";$("bNext").textContent=cur===3?"사업계획서 미리보기 ▶":cur<3?`다음 단계: ${STEPS[cur+1].name} ▶`:"";
}
function pct(i){if(i>3)return 0;const t=stepTotals(i);return t.total?t.done/t.total*100:0}

/* ───── 입력 카드 ───── */
function render(){
  refreshFlow();
  const plan=S.step===4;
  $("view").style.display=plan?"none":"";$("planWrap").style.display=plan?"":"none";
  if(plan){renderPlan()}else{$("view").innerHTML=itemsOf(S.step).map(cardHtml).join("");calcUpd()}
}
function cardHtml(it){
  const m=itMissing(it);
  return `<section class="panel" style="--cc:${NUMC[it.a]}" data-it="${it.id}">
  <div class="ph"><span class="num">${it.a?it.a:"✓"}</span><h2>${it.t}</h2><span class="tag">${it.no}</span></div>
  <div class="desc">${it.d}</div>
  <div class="need${m.length?"":" ok"}" data-need="${it.id}">${m.length?"⚠ 아직 비어 있는 필수 질문 : "+m.map(esc).join(" · "):"✔ 필수 질문을 모두 답했어요"}</div>
  ${it.qs.map((q,qi)=>qHtml(q,qi)).join("")}
  ${it.c?`<div class="out"><b>✍ 이렇게 문장이 만들어져요 <span style="font-weight:400;color:#64748b">(고쳐 써도 돼요)</span></b><textarea data-t="${it.id}" rows="4" placeholder="위 질문에 답하면 이곳에 문장이 자동으로 만들어져요. (아직 답하지 않은 부분은 ○○로 표시돼요)">${esc(textOf(it))}</textarea><div class="re" data-re="${it.id}">${S.man[it.id]?`직접 고쳐 쓴 상태 <button data-auto="${it.id}">↺ 답변으로 다시 자동 만들기</button>`:"답변을 바꾸면 문장도 자동으로 바뀌어요"}</div></div>`:""}
  <div class="tools"><button data-ex="${it.id}">✨ 예시로 채우기</button>${it.c?`<button data-ai="${it.id}">🤖 AI에게 물어볼 문장 복사</button>`:""}</div></section>`;
}
function qHtml(q,qi){
  const n="①②③④⑤"[qi],req=q.fs.some(f=>f.req)?"<em>*</em>":"",g=q.fs.length,cols=g===1?"":(g===3?"row3":"row2");
  return `<div class="f"><label>${n} ${q.l}${req}</label><div class="${cols}">${q.fs.map(fieldHtml).join("")}</div></div>`;
}
function fieldHtml(f){
  const lab=f.lab?`<div class="lab">${f.lab}</div>`:"";
  if(f.ty==="rows"){const r=rowsOf();return `<div>${r.map((x,i)=>`<div class="rows"><input type="text" list="bud" data-rn="${i}" value="${esc(x.n)}" placeholder="비목 (예: 외주용역비)"><input type="number" min="0" data-rv="${i}" value="${esc(x.v)}" placeholder="금액(만원)"></div>`).join("")}<datalist id="bud">${BUD.map(b=>`<option>${b}</option>`).join("")}</datalist><div class="calc" id="sumBox"></div></div>`}
  let inp;
  if(f.ty==="area")inp=`<textarea data-k="${f.k}" placeholder="${esc(f.ph||"")}">${esc(val(f.k))}</textarea>`;
  else if(f.ty==="num")inp=`<input type="number" min="0" data-k="${f.k}" value="${esc(val(f.k))}" placeholder="${esc(f.ph||"")}">`;
  else inp=`<input type="text" data-k="${f.k}" value="${esc(val(f.k))}" placeholder="${esc(f.ph||"")}">`;
  const cur=String(val(f.k)).split(/\s*,\s*/).filter(Boolean),list=f.o||f.ex;
  const chips=list?`<div class="chips"><span class="sp">✨ 예시</span>${list.map(o=>`<span class="chip ${f.o&&cur.includes(o)?"on":""}" data-chip="${f.k}" data-m="${f.o?1:0}" data-v="${esc(o)}">${esc(o)}</span>`).join("")}</div>`:"";
  return `<div>${lab}${inp}${chips}${f.calc?`<div class="calc" id="calc"></div>`:""}</div>`;
}
function calcUpd(){const c=$("calc");if(c)c.textContent="월 매출 = "+fm(val("price"))+"원 × "+fm(val("buyers"))+"명 = "+fm((+val("price")||0)*(+val("buyers")||0))+"원";const s=$("sumBox");if(s)s.textContent="사업비 합계 : "+fm(sumRows())+"만원"}
function refreshLive(){
  document.querySelectorAll("[data-need]").forEach(el=>{const it=ITEMS.find(x=>x.id===el.dataset.need),m=itMissing(it);el.className="need"+(m.length?"":" ok");el.textContent=m.length?"⚠ 아직 비어 있는 필수 질문 : "+m.join(" · "):"✔ 필수 질문을 모두 답했어요"});
  document.querySelectorAll("textarea[data-t]").forEach(t=>{const it=ITEMS.find(x=>x.id===t.dataset.t);if(!S.man[it.id])t.value=composed(it)});
  refreshFlow();calcUpd();
}

/* ───── 사업계획서(양식 순서 초안) ───── */
const T=s=>esc(s).replace(/\n/g,"<br>");
function ppar(it){const t=textOf(it).trim();return t?`<div class="pp">${esc(t)}</div>`:`<div class="pp pe">(작성 전 — 위 단계에서 답하면 채워져요)</div>`}
function docHtml(){
  const v=V(),r=rowsOf().filter(x=>x.n.trim()||x.v),I=id=>ITEMS.find(x=>x.id===id);
  const dash=x=>x&&x!=="○○"?x:"-";
  const kv=rows=>`<table class="ptb kv">${rows.map(a=>`<tr><th>${a[0]}</th><td>${T(dash(a[1]))}</td></tr>`).join("")}</table>`;
  const tb=(head,rows)=>`<table class="ptb"><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(x=>`<tr>${x.map(c=>`<td>${T(c)}</td>`).join("")}</tr>`).join("")}</table>`;
  const fund=sumRows()?`총 사업비 ${fm(sumRows())}만원`:"-";
  const comps=[[v.compA,v.diffA],[v.compB,v.diffB]].filter(x=>x[0]&&x[0]!=="○○");
  return `<h1 class="ptitle">예비창업패키지 사업계획서 (초안)</h1><div class="pnote">문제인식·실현가능성·성장전략·팀구성 작성 도구의 내용을 양식 순서로 종합한 초안입니다. 실제 제출은 해당 연도 공고문의 공식 양식에 옮겨 작성하세요. (공고에는 항목별 배점이 없고, 서류·발표 평가 단계별 70점 미만은 선정에서 제외됩니다.)</div>
  <h2 class="ph1">일반현황</h2>${kv([["창업아이템명",v.item],["신청자(팀)",v.who],["협약기간 내 산출물",v.deliv],["사업비",fund]])}
  <h2 class="ph1">창업아이템 개요(요약)</h2>${kv([["명칭",v.item],["아이템 개요",v.target&&v.solution&&v.target!=="○○"?`핵심 고객 ${v.target} — ${v.solution}`:""],["고객 요구사항(문제점)",v.pain],["해결 방안",v.solution],["핵심 기능",v.feature],["성장 전략",v.first]])}
  <h2 class="ph1">1. 문제 인식 (Problem)</h2><h3 class="ph2">1-1. 창업아이템의 개발 동기</h3>${ppar(I("11"))}<h3 class="ph2">1-2. 창업아이템의 목적(필요성)</h3>${ppar(I("12"))}
  <h2 class="ph1">2. 실현 가능성 (Solution)</h2><h3 class="ph2">2-1. 창업아이템의 개발·사업화 전략</h3>${v.feature&&v.feature!=="○○"?`<h4 class="ph3">핵심 기능</h4><div class="pp">${esc(v.feature)}</div>`:""}${ppar(I("21"))}${tb(["단계","주요 내용"],[["초기(1~2개월)",dash(v.m1)],["중기(3~5개월)",dash(v.m2)],["말기(6~8개월)",dash(v.m3)]])}
  <h3 class="ph2">2-2. 창업아이템의 시장분석 및 경쟁력 확보방안</h3>${ppar(I("22"))}${comps.length?tb(["경쟁사·대체재","우리와 다른 점"],comps.map(c=>[c[0],dash(c[1])])):""}
  <h2 class="ph1">3. 성장전략 (Scale-up)</h2><h3 class="ph2">3-1. 자금 소요 및 조달계획</h3>${ppar(I("31"))}${r.length?tb(["비목","금액(만원)"],[...r.map(x=>[x.n,fm(x.v)]),["합계",fm(sumRows())]]):""}
  <h3 class="ph2">3-2. 시장 진입 및 성과 창출 전략</h3>${ppar(I("32"))}
  <h2 class="ph1">4. 팀 구성 (Team)</h2><h3 class="ph2">4-1. 대표자 및 팀원의 보유 역량</h3>${ppar(I("41"))}<h3 class="ph2">4-2. 업무 파트너 현황 및 협력 방안</h3>${ppar(I("42"))}`;
}
function renderPlan(){
  const miss=ITEMS.filter(i=>!itDone(i)),mb=$("missing");
  if(miss.length){mb.className="missing";mb.innerHTML=`⚠ 아직 비어 있거나 짧은 필수 항목이 <b>${miss.length}개</b> 있어요. 눌러서 바로 작성하러 갈 수 있어요.<br>`+miss.map(x=>`<span class="m"><button data-go="${x.s}:${x.id}">${x.s+1}단계 · ${x.no}. ${esc(x.t)}</button></span>`).join("")}
  else{mb.className="missing okbox";mb.innerHTML="✔ 모든 필수 항목이 작성됐어요. 아래 초안을 확인하고 인쇄하거나 Word로 저장하세요."}
  $("planDoc").innerHTML=docHtml();
}
function saveDoc(){const h=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>사업계획서</title><style>body{font-family:'맑은 고딕';font-size:11pt}.ptitle{text-align:center;font-size:18pt}.pnote{color:#b45309;font-size:9pt;text-align:center}.ph1{font-size:14pt;background:#dde7f0;padding:4px 8px}.ph2{font-size:12pt;color:#0f766e}.ph3{font-size:11pt}.pp{border:1px solid #888;padding:6px 8px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #888;padding:4px 8px;text-align:left}th{background:#e9ecef}</style></head><body>${docHtml()}</body></html>`;
  saveFile(new Blob(["﻿"+h],{type:"application/msword"}),fn("doc"))}
function saveJson(){saveFile(new Blob([JSON.stringify({app:"bizplan-basic",v:3,data:S},null,1)],{type:"application/json"}),fn("json"))}
function aiText(it){const lines=it.qs.map(q=>`- ${q.l}: ${q.fs.map(f=>f.ty==="rows"?rowsOf().map(r=>r.n+" "+r.v+"만원").join(", "):(val(f.k)||"(미작성)")).join(" / ")}`);
  return `나는 예비창업패키지 사업계획서를 처음 쓰는 예비창업자야.\n아이템: ${val("item")||"(미정)"}\n지금 쓰는 항목: ${it.no} ${it.t}\n내가 적은 내용:\n${lines.join("\n")}\n\n부탁: 1) 평가자가 보기에 부족한 점 3가지 2) 근거·숫자를 보강할 질문 3개 3) 더 간결한 문장으로 다듬은 예시. 없는 사실은 지어내지 말고, 내가 확인해야 할 부분은 질문으로 알려줘.`}

/* ───── 이동 ───── */
function goStep(i,itemId){
  S.step=i;save();render();
  const hh=document.querySelector("header.top").offsetHeight+8;
  if(i===4){window.scrollTo(0,Math.max(0,$("planWrap").getBoundingClientRect().top+scrollY-hh));return}
  if(itemId){const el=document.querySelector(`[data-it="${itemId}"]`);if(el){window.scrollTo(0,el.getBoundingClientRect().top+scrollY-hh);return}}
  window.scrollTo(0,0);
}
function syncChips(k){const cur=String(val(k)).split(/\s*,\s*/).filter(Boolean);document.querySelectorAll(`[data-chip="${k}"]`).forEach(c=>{if(c.dataset.m==="1")c.classList.toggle("on",cur.includes(c.dataset.v))})}
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.k){S.a[t.dataset.k]=t.value;save();syncChips(t.dataset.k);refreshLive()}
  else if(t.dataset.rn!=null||t.dataset.rv!=null){const r=rowsOf().map(x=>Object.assign({},x));if(t.dataset.rn!=null)r[+t.dataset.rn].n=t.value;else r[+t.dataset.rv].v=t.value;S.a.rows=r;save();refreshLive()}
  else if(t.dataset.t){S.t[t.dataset.t]=t.value;S.man[t.dataset.t]=true;save();const re=document.querySelector(`[data-re="${t.dataset.t}"]`);if(re)re.innerHTML=`직접 고쳐 쓴 상태 <button data-auto="${t.dataset.t}">↺ 답변으로 다시 자동 만들기</button>`}
});
document.addEventListener("click",e=>{const t=e.target.closest("[data-chip],[data-step],[data-go],[data-ex],[data-ai],[data-auto]");if(!t)return;
  if(t.dataset.chip){const k=t.dataset.chip,v=t.dataset.v;if(t.dataset.m==="1"){let cur=String(val(k)).split(/\s*,\s*/).filter(Boolean);cur=cur.includes(v)?cur.filter(x=>x!==v):cur.concat(v);S.a[k]=cur.join(", ")}else S.a[k]=v;save();
    const inp=document.querySelector(`[data-k="${k}"]`);if(inp)inp.value=val(k);syncChips(k);refreshLive();return}
  if(t.dataset.step!=null){goStep(+t.dataset.step);return}
  if(t.dataset.go!=null){const [s,id]=t.dataset.go.split(":");goStep(+s,id);return}
  if(t.dataset.auto){S.man[t.dataset.auto]=false;save();document.querySelector(`textarea[data-t="${t.dataset.auto}"]`).value=composed(ITEMS.find(x=>x.id===t.dataset.auto));document.querySelector(`[data-re="${t.dataset.auto}"]`).textContent="답변을 바꾸면 문장도 자동으로 바뀌어요";return}
  if(t.dataset.ex){const it=ITEMS.find(x=>x.id===t.dataset.ex);if(allF(it).some(fFilled)&&!confirm("이미 적은 내용이 예시로 바뀝니다. 계속할까요?"))return;
    allF(it).forEach(f=>{S.a[f.k]=EX[f.k]});S.man[it.id]=false;save();const y=scrollY;render();scrollTo(0,y);setStatus("예시를 채웠어요. 내 내용으로 고쳐 쓰세요.");return}
  if(t.dataset.ai){const it=ITEMS.find(x=>x.id===t.dataset.ai),s=aiText(it);(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>setStatus("🤖 AI에게 물어볼 문장을 복사했어요. AI 채팅에 붙여 넣으세요."),()=>{prompt("아래 문장을 복사해 AI에게 붙여 넣으세요",s)});return}
});
$("btnPlan").onclick=()=>goStep(4);
$("btnSave").onclick=saveJson;
$("pRefresh").onclick=()=>{renderPlan();setStatus("🔄 새로고침했어요")};
$("pPrint").onclick=()=>window.print();
$("pDocx").onclick=saveDoc;
$("fileLoad").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.app!=="bizplan-basic")throw 0;S=Object.assign(blank(),j.data);save();render();setStatus("📂 불러왔어요: "+f.name)}catch(x){alert("이 도우미에서 저장한 json 파일이 아니에요.")}};r.readAsText(f);e.target.value=""};
$("btnReset").onclick=()=>{if(confirm("모든 내용을 지우고 새로 시작할까요?\n(먼저 ‘프로젝트 저장’을 권장해요)")){S=blank();save();render();window.scrollTo(0,0)}};
$("bPrev").onclick=()=>{if(S.step>0)goStep(S.step-1)};
$("bNext").onclick=()=>{if(S.step<4)goStep(S.step+1)};
render();
</script>
</body>
</html>
